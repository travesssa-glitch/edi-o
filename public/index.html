<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Águia Edition</title>
<style>
  :root{--bg:#0e0f12;--panel:#16181d;--panel2:#1c1f26;--line:#2a2e38;--txt:#e8e9ec;--dim:#8b90a0;--gold:#f5b301;--gold2:#ffd35c;--red:#ff5a5f;--green:#3ddc97;--blue:#4da3ff}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  #app{display:grid;height:100vh;grid-template-rows:44px 1fr 300px;grid-template-columns:260px 1fr 280px;grid-template-areas:"top top top" "bin prev insp" "tl tl tl"}
  header{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px}
  .logo b{color:var(--gold)}
  .badges{display:flex;gap:6px;margin-left:8px;flex-wrap:wrap}
  .badge{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:11px}
  .badge.ok{border-color:#1f6b4b;color:var(--green)} .badge.no{border-color:#6b2a2c;color:#ff8d90}
  .sp{flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
  .btn:hover{border-color:#444a58} .btn.gold{background:var(--gold);color:#201700;border-color:var(--gold);font-weight:700}
  .btn.gold:hover{background:var(--gold2)} .btn:disabled{opacity:.5;cursor:default}
  section{background:var(--panel);border:1px solid var(--line);min-height:0;overflow:hidden;display:flex;flex-direction:column}
  section>h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
  #bin{grid-area:bin} #prev{grid-area:prev} #insp{grid-area:insp} #tl{grid-area:tl}
  .scroll{overflow:auto;padding:10px;flex:1}
  .drop{border:1px dashed #3a4050;border-radius:8px;padding:14px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:10px}
  .drop.over{border-color:var(--gold);color:var(--gold)}
  .media{display:flex;gap:8px;align-items:center;padding:6px;border-radius:6px;cursor:pointer}
  .media:hover{background:var(--panel2)}
  .media .th{width:72px;height:40px;border-radius:4px;background:#000 center/cover;flex:none}
  .media small{color:var(--dim)}
  /* preview */
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#050506;min-height:0;position:relative}
  #stage{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;background:#000}
  #stage video{width:100%;height:100%;object-fit:contain;display:block}
  .ovTitle{position:absolute;left:50%;transform:translateX(-50%);padding:.25em .7em;background:rgba(0,0,0,.45);color:#fff;font-weight:800;text-align:center;white-space:nowrap;pointer-events:none}
  #transport{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
  #tc{font-variant-numeric:tabular-nums;color:var(--gold);min-width:120px}
  /* inspector */
  .f{display:grid;grid-template-columns:90px 1fr;gap:6px 8px;align-items:center;margin-bottom:12px}
  .f label{color:var(--dim)} .f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%}
  .f input[type=range]{padding:0}
  .grp{margin:14px 0 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
  .empty{color:var(--dim);padding:20px;text-align:center}
  /* timeline */
  #tl{display:grid;grid-template-rows:1fr 96px}
  #tlTop{display:flex;flex-direction:column;min-height:0}
  #tlTools{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);align-items:center}
  #tlScroll{flex:1;overflow:auto;position:relative}
  #tlInner{position:relative;min-height:100%}
  #ruler{height:22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3;cursor:pointer}
  .tick{position:absolute;top:0;height:100%;border-left:1px solid #343a48;padding-left:3px;color:var(--dim);font-size:10px}
  .track{position:relative;height:62px;border-bottom:1px solid #22262f}
  .track.small{height:30px}
  .tlabel{position:sticky;left:0;z-index:2;display:inline-block;background:#0000;color:var(--dim);font-size:10px;padding:2px 6px}
  .clip{position:absolute;top:5px;bottom:5px;border-radius:5px;border:1px solid #3b6aa8;background:#24415f center/auto 100% repeat-x;overflow:hidden;cursor:grab}
  .clip.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .clip span{position:absolute;left:4px;top:2px;font-size:10px;background:#000a;padding:0 4px;border-radius:3px;white-space:nowrap}
  .clip .tag{left:auto;right:4px;color:var(--gold)}
  .ttl{position:absolute;top:4px;bottom:4px;border-radius:4px;background:#5a3d7a;border:1px solid #8a5fb8;font-size:10px;padding:2px 5px;overflow:hidden;white-space:nowrap}
  .ovl{position:absolute;top:4px;bottom:4px;border-radius:4px;background:#1f5d4c;border:1px solid #3ddc97;font-size:10px;padding:2px 5px;overflow:hidden;white-space:nowrap}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:4;pointer-events:none}
  #playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--red)}
  /* AI panel */
  #ai{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;min-height:0;background:var(--panel2)}
  #feed{overflow:auto;padding:8px 12px;font-size:12px}
  .msg{margin:2px 0;color:var(--dim)} .msg.me{color:var(--txt)} .msg.me::before{content:"› ";color:var(--gold)}
  .msg.ok::before{content:"✔ ";color:var(--green)} .msg.err{color:#ff8d90} .msg.note::before{content:"· "}
  #cmdRow{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
  #cmd{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  #cmd:focus{outline:1px solid var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--dim);cursor:pointer;font-size:11px;background:var(--bg)}
  .chip:hover{color:var(--gold);border-color:var(--gold)}
  #bar{height:3px;background:#222;position:absolute;left:0;right:0;top:44px;display:none;z-index:9}
  #bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="app">
  <header>
    <div class="logo">🦅 <span>ÁGUIA <b>EDITION</b></span></div>
    <div class="badges" id="badges"></div>
    <div class="sp"></div>
    <button class="btn" id="saveBtn">Salvar</button>
    <button class="btn gold" id="renderBtn">Exportar MP4</button>
  </header>

  <section id="bin">
    <h3>Mídia</h3>
    <div class="scroll">
      <div class="drop" id="drop">Arraste vídeos aqui<br>ou clique para importar<input id="file" type="file" accept="video/*,audio/*" multiple hidden></div>
      <div id="mediaList"></div>
    </div>
  </section>

  <section id="prev">
    <h3>Programa</h3>
    <div id="stageWrap"><div id="stage"><video id="vid" playsinline></video><div id="titles"></div></div></div>
    <div id="transport">
      <button class="btn" id="play">▶</button>
      <button class="btn" id="back">⏮</button>
      <span id="tc">00:00.00 / 00:00.00</span>
      <div class="sp"></div>
      <button class="btn" id="splitBtn">✂ Dividir (S)</button>
      <button class="btn" id="delBtn">🗑 Apagar</button>
    </div>
  </section>

  <section id="insp">
    <h3>Inspetor</h3>
    <div class="scroll" id="inspBody"><div class="empty">Selecione um clip na timeline.</div></div>
  </section>

  <section id="tl">
    <div id="tlTop">
      <div id="tlTools"><span style="color:var(--dim)">Zoom</span><input type="range" id="zoom" min="10" max="200" value="60"><span class="sp"></span><span style="color:var(--dim)" id="tlInfo"></span></div>
      <div id="tlScroll"><div id="tlInner">
        <div id="ruler"></div>
        <div class="track" id="trV"></div>
        <div class="track small" id="trT"></div>
        <div class="track small" id="trO"></div>
        <div id="playhead"></div>
      </div></div>
    </div>
    <div id="ai">
      <div id="feed"></div>
      <div>
        <div class="chips" id="chips"></div>
        <div id="cmdRow"><input id="cmd" placeholder='Fale com a Águia IA: "faz um speed ramp de 1x pra 0.3x", "colorização cinematográfica", "remove os silêncios"…' autocomplete="off"><button class="btn gold" id="send">Enviar</button></div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
let project = { clips: [], titles: [], overlays: [] }, mediaFiles = [], selected = null, T = 0, playing = false, pps = 60, lastTs = 0, curClipId = null;
const CSSF = { none:'', cinematic:'contrast(1.08) saturate(.92) sepia(.15)', 'teal-orange':'contrast(1.1) saturate(1.2) hue-rotate(-8deg)', punch:'contrast(1.15) saturate(1.3)', warm:'sepia(.25) saturate(1.1)', cold:'hue-rotate(15deg) saturate(.95)', bw:'grayscale(1) contrast(1.15)', vintage:'sepia(.4) saturate(.85) contrast(.95)', neutral:'contrast(1.04) saturate(1.05)' };
const fmt = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); };
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
const post = (url, body) => api(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

// ---- modelo de tempo (espelha lib/render.js) ----
function segs(c) {
  if (c.ramp) { const { from = 1, to = 1, steps = 10, curve = 'ease' } = c.ramp, d = c.out - c.in, a = [];
    for (let i = 0; i < steps; i++) { const t = (i + .5) / steps, k = curve === 'ease' ? t * t * (3 - 2 * t) : t;
      a.push({ in: c.in + d * i / steps, out: c.in + d * (i + 1) / steps, speed: Math.min(16, Math.max(.1, from + (to - from) * k)) }); } return a; }
  return [{ in: c.in, out: c.out, speed: Math.min(16, Math.max(.1, c.speed || 1)) }];
}
const outDur = (c) => segs(c).reduce((a, s) => a + (s.out - s.in) / s.speed, 0);
const total = () => project.clips.reduce((a, c) => a + outDur(c), 0);
function locate(t) { let acc = 0;
  for (const c of project.clips) { const d = outDur(c); if (t < acc + d || c === project.clips[project.clips.length - 1]) {
      let lt = Math.min(t - acc, d); for (const s of segs(c)) { const sd = (s.out - s.in) / s.speed; if (lt <= sd) return { clip: c, src: s.in + lt * s.speed, speed: s.speed, start: acc }; lt -= sd; }
      return { clip: c, src: c.out, speed: 1, start: acc }; } acc += d; } return null; }

// ---- render UI ----
function drawTimeline() {
  const dur = Math.max(total(), 10), W = dur * pps + 200;
  $('#tlInner').style.width = W + 'px';
  let r = ''; const step = pps >= 100 ? 1 : pps >= 40 ? 2 : 5;
  for (let s = 0; s <= dur + 3; s += step) r += `<div class="tick" style="left:${s * pps}px">${fmt(s).slice(0, 5)}</div>`;
  $('#ruler').innerHTML = r;
  let x = 0, v = '<span class="tlabel">V1</span>';
  for (const c of project.clips) { const w = Math.max(14, outDur(c) * pps), m = mediaFiles.find((m) => m.file === c.src);
    const tags = [c.ramp ? `ramp ${c.ramp.from}→${c.ramp.to}x` : (c.speed && c.speed !== 1 ? c.speed + 'x' : ''), c.grade && c.grade !== 'none' ? c.grade : ''].filter(Boolean).join(' · ');
    v += `<div class="clip ${c.id === selected ? 'sel' : ''}" draggable="true" data-id="${c.id}" style="left:${x}px;width:${w}px;${m ? `background-image:url('${m.strip}');background-size:${(m.duration / Math.max(.1, c.out - c.in)) * w}px 100%;background-position:${-(c.in / m.duration) * (m.duration / Math.max(.1, c.out - c.in)) * w}px 0;background-repeat:no-repeat;` : ''}"><span>${c.name}</span>${tags ? `<span class="tag" style="top:auto;bottom:2px">${tags}</span>` : ''}</div>`;
    x += outDur(c) * pps; }
  $('#trV').innerHTML = v;
  $('#trT').innerHTML = '<span class="tlabel">T</span>' + (project.titles || []).map((t) => `<div class="ttl" style="left:${t.start * pps}px;width:${t.duration * pps}px">${t.text}</div>`).join('');
  $('#trO').innerHTML = '<span class="tlabel">FX</span>' + (project.overlays || []).map((o) => `<div class="ovl" style="left:${o.start * pps}px;width:${o.duration * pps}px">${o.src}</div>`).join('');
  $('#tlInfo').textContent = `${project.clips.length} clips · ${fmt(total())}`;
  movePlayhead();
}
const movePlayhead = () => { $('#playhead').style.left = T * pps + 'px'; $('#tc').textContent = `${fmt(T)} / ${fmt(total())}`; };

function drawMedia() {
  $('#mediaList').innerHTML = mediaFiles.map((m) => `<div class="media" data-f="${m.file}"><div class="th" style="background-image:url('${m.strip}')"></div><div><div>${m.file}</div><small>${fmt(m.duration)} · ${m.width || '-'}×${m.height || '-'}</small></div></div>`).join('') || '<div class="empty">Sem mídia ainda.</div>';
}

function drawInspector() {
  const c = project.clips.find((x) => x.id === selected);
  if (!c) { $('#inspBody').innerHTML = '<div class="empty">Selecione um clip na timeline.</div>'; return; }
  const grades = Object.keys(CSSF).map((g) => `<option ${c.grade === g ? 'selected' : ''}>${g}</option>`).join('');
  const rp = c.ramp || null;
  $('#inspBody').innerHTML = `
  <div class="grp">${c.name}</div>
  <div class="f"><label>Início (s)</label><input type="number" step="0.1" data-k="in" value="${c.in.toFixed(2)}"><label>Fim (s)</label><input type="number" step="0.1" data-k="out" value="${c.out.toFixed(2)}"></div>
  <div class="grp">Velocidade</div>
  <div class="f"><label>Constante</label><input type="number" step="0.1" min="0.1" max="16" data-k="speed" value="${c.speed || 1}" ${rp ? 'disabled' : ''}>
  <label>Speed ramp</label><select data-k="rampOn"><option value="0">Desligado</option><option value="1" ${rp ? 'selected' : ''}>Ligado</option></select>
  <label>De (x)</label><input type="number" step="0.1" data-k="rampFrom" value="${rp ? rp.from : 1}" ${rp ? '' : 'disabled'}>
  <label>Para (x)</label><input type="number" step="0.1" data-k="rampTo" value="${rp ? rp.to : 0.3}" ${rp ? '' : 'disabled'}></div>
  <div class="grp">Cor</div>
  <div class="f"><label>Look</label><select data-k="grade">${grades}</select></div>
  <div class="grp">Áudio / Transição</div>
  <div class="f"><label>Volume</label><input type="range" min="0" max="2" step="0.05" data-k="volume" value="${c.volume ?? 1}"><label>Mudo</label><select data-k="mute"><option value="0">Não</option><option value="1" ${c.mute ? 'selected' : ''}>Sim</option></select>
  <label>Fade-in (s)</label><input type="number" step="0.1" min="0" data-k="fade" value="${c.fade || 0}"></div>`;
}

function applyInspector(k, val) {
  const c = project.clips.find((x) => x.id === selected); if (!c) return;
  if (k === 'in' || k === 'out') c[k] = +val;
  else if (k === 'speed') c.speed = +val;
  else if (k === 'rampOn') { if (val === '1') { delete c.speed; c.ramp = { from: 1, to: 0.3, steps: 12, curve: 'ease' }; } else { delete c.ramp; c.speed = 1; } }
  else if (k === 'rampFrom') c.ramp.from = +val; else if (k === 'rampTo') c.ramp.to = +val;
  else if (k === 'grade') c.grade = val; else if (k === 'volume') c.volume = +val; else if (k === 'mute') c.mute = val === '1';
  else if (k === 'fade') c.fade = +val || 0;
  refresh(true); persist();
}

function refresh(keepInsp) { drawTimeline(); drawMedia(); if (!keepInsp) drawInspector(); else if (document.activeElement.tagName !== 'INPUT') drawInspector(); seek(T, true); }
let persistT; const persist = () => { clearTimeout(persistT); persistT = setTimeout(() => post('/api/project', project).catch(() => {}), 400); };

// ---- player ----
const vid = $('#vid');
function seek(t, force) {
  T = Math.min(Math.max(0, t), Math.max(total(), 0.001));
  const L = locate(T);
  if (!L) { vid.removeAttribute('src'); curClipId = null; renderTitles(); movePlayhead(); return; }
  if (curClipId !== L.clip.id || force) {
    const url = '/media/' + encodeURIComponent(L.clip.src);
    if (!vid.src.endsWith(encodeURIComponent(L.clip.src))) vid.src = url;
    curClipId = L.clip.id;
  }
  if (Math.abs(vid.currentTime - L.src) > 0.25 || !playing) { try { vid.currentTime = L.src; } catch {} }
  vid.playbackRate = Math.min(16, Math.max(.0625, L.speed)); vid.muted = !!L.clip.mute; vid.volume = Math.min(1, L.clip.volume ?? 1);
  vid.style.filter = CSSF[L.clip.grade] || '';
  renderTitles(); movePlayhead();
}
function renderTitles() {
  $('#titles').innerHTML = (project.titles || []).filter((t) => T >= t.start && T <= t.start + t.duration)
    .map((t) => `<div class="ovTitle" style="top:${t.position === 'lower' ? '82%' : t.position === 'top' ? '10%' : '45%'};font-size:${(t.size || 64) / 1080 * $('#stage').clientHeight}px">${t.text}</div>`).join('');
}
function loop(ts) {
  if (playing) { const dt = (ts - lastTs) / 1000; lastTs = ts; T += dt;
    if (T >= total()) { playing = false; vid.pause(); $('#play').textContent = '▶'; T = total(); }
    else { const L = locate(T); if (L && curClipId !== L.clip.id) { seek(T, true); vid.play().catch(() => {}); } else seek(T); }
    movePlayhead(); const sc = $('#tlScroll'), px = T * pps; if (px > sc.scrollLeft + sc.clientWidth - 60) sc.scrollLeft = px - 60; }
  requestAnimationFrame(loop);
}
function togglePlay() { if (!project.clips.length) return; playing = !playing; $('#play').textContent = playing ? '⏸' : '▶'; lastTs = performance.now(); if (playing) { if (T >= total() - .05) T = 0; seek(T, true); vid.play().catch(() => {}); } else vid.pause(); }

// ---- ações ----
function say(txt, cls = '') { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt; $('#feed').appendChild(d); $('#feed').scrollTop = 1e9; }
function progress(p) { $('#bar').style.display = p == null ? 'none' : 'block'; if (p != null) $('#bar i').style.width = (p * 100) + '%'; }
async function waitJob(id, label) {
  for (;;) { const j = await api('/api/job?id=' + id); progress(j.status === 'running' ? Math.max(.05, j.progress) : null);
    if (j.status === 'done') return j.result; if (j.status === 'error') throw new Error(j.error); await new Promise((r) => setTimeout(r, 600)); } }

async function sendCmd(text) {
  if (!text.trim()) return; say(text, 'me'); $('#cmd').value = '';
  try {
    const r = await post('/api/command', { text, selectedId: selected });
    project = r.project; (r.notes || []).forEach((n) => say(n, 'note')); (r.actions || []).forEach((a) => say(a, 'ok')); refresh();
    if (r.jobId) { const res = await waitJob(r.jobId); project = res.project; (res.actions || []).forEach((a) => say(a, 'ok')); refresh(); }
    if (!selected && project.clips[0]) { selected = project.clips[0].id; refresh(); }
  } catch (e) { say('Erro: ' + e.message, 'err'); progress(null); }
}

async function upload(files) {
  for (const f of files) { say(`Importando ${f.name}…`, 'note');
    try { const r = await api('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f }); project = r.project; say(`${f.name} importado`, 'ok'); }
    catch (e) { say('Erro: ' + e.message, 'err'); } }
  mediaFiles = await api('/api/media'); if (!selected && project.clips[0]) selected = project.clips[0].id; refresh();
}

async function exportMp4() {
  if (!project.clips.length) return say('Timeline vazia.', 'err');
  $('#renderBtn').disabled = true; say('Renderizando com FFmpeg…', 'note');
  try { await post('/api/project', project); const { jobId } = await post('/api/render', {}); const r = await waitJob(jobId);
    say(`Exportado (${fmt(r.duration)}). Baixando…`, 'ok'); const a = document.createElement('a'); a.href = r.url; a.download = 'aguia-edition.mp4'; a.click(); }
  catch (e) { say('Erro no render: ' + e.message, 'err'); }
  progress(null); $('#renderBtn').disabled = false;
}

function splitAtPlayhead() {
  const L = locate(T); if (!L) return; const c = L.clip; if (L.src <= c.in + .05 || L.src >= c.out - .05) return;
  if (c.ramp) return say('Divisão não suportada em clip com speed ramp; desligue o ramp primeiro.', 'err');
  const i = project.clips.indexOf(c), n = { ...c, id: 'c' + Math.random().toString(36).slice(2, 8), name: c.name + 'b', in: L.src }; c.out = L.src; project.clips.splice(i + 1, 0, n); refresh(); persist();
}
function deleteSelected() { project.clips = project.clips.filter((c) => c.id !== selected); selected = project.clips[0]?.id || null; refresh(); persist(); }

// ---- eventos ----
$('#play').onclick = togglePlay; $('#back').onclick = () => seek(0, true);
$('#send').onclick = () => sendCmd($('#cmd').value); $('#cmd').onkeydown = (e) => { if (e.key === 'Enter') sendCmd($('#cmd').value); };
$('#renderBtn').onclick = exportMp4; $('#saveBtn').onclick = async () => { await post('/api/project', project); say('Projeto salvo', 'ok'); };
$('#splitBtn').onclick = splitAtPlayhead; $('#delBtn').onclick = deleteSelected;
$('#zoom').oninput = (e) => { pps = +e.target.value; drawTimeline(); };
$('#drop').onclick = () => $('#file').click(); $('#file').onchange = (e) => upload([...e.target.files]);
$('#drop').ondragover = (e) => { e.preventDefault(); $('#drop').classList.add('over'); }; $('#drop').ondragleave = () => $('#drop').classList.remove('over');
$('#drop').ondrop = (e) => { e.preventDefault(); $('#drop').classList.remove('over'); upload([...e.dataTransfer.files]); };
$('#mediaList').onclick = async (e) => { const m = e.target.closest('.media'); if (!m) return; project = await post('/api/add-clip', { file: m.dataset.f }); refresh(); };
$('#ruler').onclick = (e) => { const x = e.clientX - $('#ruler').getBoundingClientRect().left; seek(x / pps, true); };
$('#trV').onclick = (e) => { const c = e.target.closest('.clip'); if (c) { selected = c.dataset.id; refresh(); } };
$('#inspBody').addEventListener('change', (e) => e.target.dataset.k && applyInspector(e.target.dataset.k, e.target.value));
$('#inspBody').addEventListener('input', (e) => e.target.type === 'range' && applyInspector(e.target.dataset.k, e.target.value));
let dragId = null; $('#trV').ondragstart = (e) => { dragId = e.target.closest('.clip')?.dataset.id; };
$('#trV').ondragover = (e) => e.preventDefault();
$('#trV').ondrop = (e) => { e.preventDefault(); const x = e.clientX - $('#trV').getBoundingClientRect().left; const from = project.clips.findIndex((c) => c.id === dragId); if (from < 0) return;
  let acc = 0, to = project.clips.length; for (let i = 0; i < project.clips.length; i++) { const d = outDur(project.clips[i]) * pps; if (x < acc + d / 2) { to = i; break; } acc += d; }
  const [c] = project.clips.splice(from, 1); project.clips.splice(to > from ? to - 1 : to, 0, c); refresh(); persist(); };
window.onkeydown = (e) => { if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); } if (e.key === 's' || e.key === 'S') splitAtPlayhead(); if (e.key === 'Delete') deleteSelected(); };
$('#chips').innerHTML = ['speed ramp de 1x para 0.3x', 'colorização cinematográfica', 'remove os silêncios', 'velocidade 2x', 'título: "Meu vídeo"', 'cria uma intro "ÁGUIA"', 'preto e branco'].map((t) => `<span class="chip">${t}</span>`).join('');
$('#chips').onclick = (e) => e.target.classList.contains('chip') && sendCmd(e.target.textContent);

(async function init() {
  project = await api('/api/project'); mediaFiles = await api('/api/media'); selected = project.clips[0]?.id || null;
  const st = await api('/api/integrations');
  const b = (ok, t) => `<span class="badge ${ok ? 'ok' : 'no'}">${t}</span>`;
  $('#badges').innerHTML = b(st.ffmpeg, 'FFmpeg') + b(true, 'HyperFrames (npx)') + b(st.videoUseInstalled && st.elevenLabsKey && st.claudeCli, 'Video-Use') + b(st.anthropicKey, 'Modo IA livre');
  say('Águia pronta. Importe vídeos e me diga o que fazer.', 'note');
  refresh(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
